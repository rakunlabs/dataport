on: [push]

name: Test
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # The store tests run on SQLite and on this PostgreSQL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m --new-from-rev=HEAD~1 --issues-exit-code=0 --build-tags odbc,duckdb
      - name: Run tests
        run: |
          GOPATH="$(dirname ${PWD})" golangci-lint run --build-tags odbc,duckdb --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.out ./...
          go test -tags odbc,duckdb -coverprofile=coverage.out -json ./... > test-report.out
        env:
          DATAPORT_TEST_POSTGRES_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres?sslmode=disable
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ env.REPOSITORY_NAME }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.out
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.out
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**,**/*_test.go,_ui/node_modules/**,internal/server/dist/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm and Node.js come from _ui/package.json (packageManager and
      # devEngines.runtime), so CI builds with the same versions as local.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: _ui
          cache: true
          require-lockfile: true
      - name: Type-check and build
        working-directory: _ui
        run: |
          pnpm check
          pnpm build
