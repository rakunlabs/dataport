# Sample databases for development. Each service has a profile of its own
# name; "all" starts every one and "store" only what the app database needs.
#   make env                      # all
#   make env PROFILE=postgres
#   make env PROFILE="postgres mysql"
services:
  postgres:
    profiles: [all, postgres, store, cluster]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pw
    ports:
      - "55432:5432"

  mysql:
    profiles: [all, mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: app
    ports:
      - "53306:3306"

  mssql:
    profiles: [all, mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Str0ng!Passw0rd
    ports:
      - "51433:1433"

  clickhouse:
    profiles: [all, clickhouse]
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: pw
      CLICKHOUSE_DB: app
    ports:
      - "59000:9000"

  oracle:
    profiles: [all, oracle]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: pw
      APP_USER: app
      APP_USER_PASSWORD: pw
    ports:
      - "51521:1521"

  trino:
    profiles: [all, trino]
    image: trinodb/trino:479
    ports:
      - "58080:8080"

  # Three dataport replicas sharing the postgres store, joined as a cluster:
  #   make build-cluster env PROFILE=cluster
  # They answer on :8081, :8082 and :8083 (admin / change-me-now).
  dataport-1: &replica
    profiles: [cluster]
    image: alpine:3.22
    command: ["/dataport"]
    volumes:
      - ../bin/dataport-linux:/dataport:ro
    environment: &replica-env
      DATAPORT_STORE_TYPE: postgres
      DATAPORT_STORE_DSN: postgres://postgres:pw@postgres:5432/postgres?sslmode=disable
      DATAPORT_AUTH_SECRET_KEY: cluster-dev-secret
      DATAPORT_AUTH_ADMIN_PASSWORD: change-me-now
      DATAPORT_CLUSTER_ENABLED: "true"
      DATAPORT_CLUSTER_DNS_ADDR: dataport-replica
      DATAPORT_CLUSTER_REPLICAS: "3"
      DATAPORT_CLUSTER_SECURITY_KEY: cluster-dev-key
      DATAPORT_CLUSTER_REFRESH_INTERVAL: 5s
      DATAPORT_CLUSTER_NAME: dataport-1
    networks:
      default:
        aliases: [dataport-replica]
    depends_on: [postgres]
    restart: on-failure
    ports:
      - "8081:8080"

  dataport-2:
    <<: *replica
    environment:
      <<: *replica-env
      DATAPORT_CLUSTER_NAME: dataport-2
    ports:
      - "8082:8080"

  dataport-3:
    <<: *replica
    environment:
      <<: *replica-env
      DATAPORT_CLUSTER_NAME: dataport-3
    ports:
      - "8083:8080"
