# Sample databases for development. Each service has a profile of its own
# name; "all" starts every one and "store" only what the app database needs.
#   make env                      # all
#   make env PROFILE=postgres
#   make env PROFILE="postgres mysql"
services:
  postgres:
    profiles: [all, postgres, store]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pw
    ports:
      - "55432:5432"

  mysql:
    profiles: [all, mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: app
    ports:
      - "53306:3306"

  mssql:
    profiles: [all, mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Str0ng!Passw0rd
    ports:
      - "51433:1433"

  clickhouse:
    profiles: [all, clickhouse]
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: pw
      CLICKHOUSE_DB: app
    ports:
      - "59000:9000"

  oracle:
    profiles: [all, oracle]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: pw
      APP_USER: app
      APP_USER_PASSWORD: pw
    ports:
      - "51521:1521"

  trino:
    profiles: [all, trino]
    image: trinodb/trino:479
    ports:
      - "58080:8080"
